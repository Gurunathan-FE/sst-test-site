<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bike buying enquiry</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a222c;
      --border: #2d3a47;
      --text: #e8eef4;
      --muted: #8b9aab;
      --accent: #3d9a6e;
      --accent-hover: #4db884;
      --error: #e06c6c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }

    header {
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0 0 0.5rem;
      letter-spacing: -0.02em;
    }

    .lead {
      color: var(--muted);
      font-size: 0.95rem;
      margin: 0;
    }

    form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    .field {
      margin-bottom: 1.1rem;
    }

    .field:last-of-type {
      margin-bottom: 1.25rem;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 0.65rem 0.75rem;
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .row {
      display: grid;
      gap: 1rem;
    }

    @media (min-width: 480px) {
      .row {
        grid-template-columns: 1fr 1fr;
      }
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.75rem 1rem;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button[type="submit"]:hover {
      background: var(--accent-hover);
    }

    .note {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Bike buying enquiry</h1>
      <p class="lead">Tell us what you are looking for and we will get back to you.</p>
    </header>

    <form action="#" method="post" novalidate>
      <div class="row">
        <div class="field">
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="phone">Phone</label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" required>
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>

      <div class="row">
        <div class="field">
          <label for="bike-type">Bike type</label>
          <select id="bike-type" name="bike_type" required>
            <option value="">Choose…</option>
            <option value="road">Road</option>
            <option value="mountain">Mountain</option>
            <option value="hybrid">Hybrid / commuter</option>
            <option value="electric">Electric (e-bike)</option>
            <option value="gravel">Gravel</option>
            <option value="kids">Kids</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="field">
          <label for="budget">Budget (approx.)</label>
          <select id="budget" name="budget" required>
            <option value="">Choose…</option>
            <option value="under-500">Under 500</option>
            <option value="500-1000">500 – 1,000</option>
            <option value="1000-2000">1,000 – 2,000</option>
            <option value="2000-4000">2,000 – 4,000</option>
            <option value="4000-plus">4,000+</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="model">Preferred brand or model (optional)</label>
        <input id="model" name="model" type="text" placeholder="e.g. Trek Domane, Giant Defy">
      </div>

      <div class="field">
        <label for="message">Questions or details</label>
        <textarea id="message" name="message" placeholder="Frame size, intended use, timeline…"></textarea>
      </div>

      <button type="submit">Send enquiry</button>
    </form>

    <p class="note">This demo form does not send data yet. Point <code>action</code> to your server or a form service when ready.</p>
  </div>
  <script src="common.js"></script>
</body>
</html>
